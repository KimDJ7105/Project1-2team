apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-deployment
  namespace: finance-app
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: finance-app
  template:
    metadata:
      labels:
        app: finance-app
    spec:
      # ========================================================
      # initContainer
      # ========================================================
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z -w 2 finance-db-svc 3306; do
            echo "[-] 아직 DB 포트가 비활성화 상태입니다. 2초 후 재시도합니다..."
            sleep 2
          done
          echo "[+] MySQL 엔진이 활성화되었습니다."

      # ========================================================
      # main application
      # ========================================================
      containers:
      - name: finance-app-container
        image: toymas24/project1-team2-app:1.3
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: DB_URL
          value: "jdbc:mysql://finance-db-svc:3306/testdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
        - name: DB_USERNAME
          value: "root"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret # secret 명칭
              key: MYSQL_ROOT_PASSWORD # secret 내부 key
        - name: SPRING_SQL_INIT_MODE # 최초 실행 후 삭제해야함. 
          value: "always"