apiVersion: v1
kind: Service
metadata:
  name: finance-svc
  namespace: finance-app
spec:
  selector:
    app: finance        # 이 라벨을 가진 파드로 트래픽 전달
  ports:
    - protocol: TCP
      port: 80          # Service가 외부에 노출하는 포트
      targetPort: 8080  # 실제 파드가 사용하는 포트
  type: ClusterIP       # 클러스터 내부에서만 접근 가능