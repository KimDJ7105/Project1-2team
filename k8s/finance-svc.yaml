apiVersion: v1
kind: Service
metadata:
  name: finance-app-svc   # 웹 서버 서비스 이름
  namespace: finance-app  # 동일한 가상 방에 안착
spec:
  type: ClusterIP
  selector:
    app: finance-app      # 내 Deployment의 라벨 명찰을 조준
  ports:
    - protocol: TCP
      port: 80              # Service가 외부에 노출하는 포트
      targetPort: 8080      # 실제 파드가 사용하는 포트
  type: ClusterIP           # 클러스터 내부에서만 접근 가능