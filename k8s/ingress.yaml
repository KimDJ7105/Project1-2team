apiVersion: networking.k8s.io/v1
kind: Ingress            
metadata:
  name: finance-ingress 
  namespace: finance-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /  # 요청 경로를 /로 재작성
spec:
  ingressClassName: nginx           # ingress-nginx 컨트롤러 사용
  rules:
    - host: app.k8s.jyang.synology.me  # 이 도메인으로 들어오는 요청 처리
      http:
        paths:
          - path: /                 # 모든 경로 처리
            pathType: Prefix        # /로 시작하는 모든 경로 매칭
            backend:
              service:
                name: finance-svc  # 트래픽을 전달할 Service 이름 (service.yaml과 일치)
                port:
                  number: 80       # Service의 port (service.yaml의 port와 일치)