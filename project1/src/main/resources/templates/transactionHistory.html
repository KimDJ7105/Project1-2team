<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>거래 내역</title>

<style>

body{
    margin:0;
    font-family:"Segoe UI", Arial, sans-serif;
    background:linear-gradient(135deg,#eaf6ff,#f7fbff);
}

/* 상단 */

.header{
    background:linear-gradient(90deg,#3bb6ff,#5ad7ff);
    color:white;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    padding:20px;
}

.divider{
    height:1px;
    background:#d6ecff;
}

/* 카드 */

.container{

    width:760px;
    margin:40px auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

/* 제목 */

.title{

    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#1e88e5;
    padding:35px 0;

}

/* 계좌선택 */

.accountArea{

    border-top:1px solid #e8eef5;
    border-bottom:1px solid #e8eef5;
    padding:25px 40px;

}

.accountArea label{

    font-size:20px;
    font-weight:bold;
    color:#333;

}

.accountArea select{

    margin-left:15px;
    padding:10px 16px;
    border-radius:10px;
    border:1px solid #bcdfff;
    font-size:16px;

}

/* 테이블 */

.tableArea{

    padding:30px 40px;

}

table{

    width:100%;
    border-collapse:collapse;

}

th{

    background:#eaf6ff;
    color:#1e88e5;
    padding:15px;
    font-size:18px;

}

td{

    text-align:center;
    padding:18px;
    border-bottom:1px solid #eef3f8;
    font-size:17px;

}

tr:hover{

    background:#f8fcff;

}

/* 위험도 */

.safe{

    color:#2e7d32;
    font-weight:bold;

}

.danger{

    color:#e53935;
    font-weight:bold;

}

/* 버튼 */

.buttonArea{

    text-align:center;
    padding:35px;
    border-top:1px solid #e8eef5;

}

.confirmBtn{

    display:inline-block;
    padding:13px 40px;
    background:linear-gradient(90deg,#1e88e5,#42a5f5);
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
    box-shadow:0 5px 12px rgba(0,0,0,.15);
    transition:.2s;

}

.confirmBtn:hover{

    transform:scale(1.05);

}

</style>

</head>

<body>

<div class="header">
    거래 내역
</div>

<div class="divider"></div>

<div class="container">

    <div class="title">
        거래 내역
    </div>

    <div class="accountArea">

        <label>계좌 선택 ▼</label>

        <select>

            <option>123-456-78910</option>
            <option>321-234-25252</option>

        </select>

    </div>

    <div class="tableArea">

        <table>

            <tr>

                <th>날짜</th>
                <th>유형</th>
                <th>금액</th>
                <th>위험도</th>

            </tr>

            <tr>

                <td>06/26</td>
                <td>송금</td>
                <td>50만원</td>
                <td class="safe">정상</td>

            </tr>

            <tr>

                <td>06/25</td>
                <td>입금</td>
                <td>800만원</td>
                <td class="danger">위험</td>

            </tr>

            <tr>

                <td>06/22</td>
                <td>출금</td>
                <td>100만원</td>
                <td class="safe">정상</td>

            </tr>

            <tr>

                <td>06/20</td>
                <td>송금</td>
                <td>1000만원</td>
                <td class="danger">위험</td>

            </tr>

        </table>

    </div>

    <div class="buttonArea">

        <a href="/home" class="confirmBtn">
            확인
        </a>

    </div>

</div>

</body>
</html>
