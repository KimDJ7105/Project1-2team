<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>거래 내역</title>

<style>

body{
    margin:0;
    font-family:"Segoe UI", Arial, sans-serif;
    background:linear-gradient(135deg,#eaf6ff,#f7fbff);
}

/* 상단 */
.header{
    background:linear-gradient(90deg,#3bb6ff,#5ad7ff);
    color:white;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    padding:20px;
}

.divider{
    height:1px;
    background:#d6ecff;
}

/* 카드 */
.container{
    width:760px;
    margin:40px auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

/* 제목 */
.title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#1e88e5;
    padding:35px 0;
}

/* 계좌선택 */
.accountArea{
    border-top:1px solid #e8eef5;
    border-bottom:1px solid #e8eef5;
    padding:25px 40px;
}

.accountArea label{
    font-size:20px;
    font-weight:bold;
    color:#333;
}

.accountArea select{
    margin-left:15px;
    padding:10px 16px;
    border-radius:10px;
    border:1px solid #bcdfff;
    font-size:16px;
}

/* 테이블 */
.tableArea{
    padding:30px 40px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#eaf6ff;
    color:#1e88e5;
    padding:15px;
    font-size:18px;
}

td{
    text-align:center;
    padding:18px;
    border-bottom:1px solid #eef3f8;
    font-size:17px;
}

tr:hover{
    background:#f8fcff;
}

/* 위험도 */
.safe{
    color:#2e7d32;
    font-weight:bold;
}

.danger{
    color:#e53935;
    font-weight:bold;
}

/* 버튼 */
.buttonArea{
    text-align:center;
    padding:35px;
    border-top:1px solid #e8eef5;
}

.confirmBtn{
    display:inline-block;
    padding:13px 40px;
    background:linear-gradient(90deg,#1e88e5,#42a5f5);
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
    box-shadow:0 5px 12px rgba(0,0,0,.15);
    transition:.2s;
}

.confirmBtn:hover{
    transform:scale(1.05);
}

</style>

</head>

<body>

<div class="header">
    거래 내역
</div>

<div class="divider"></div>

<div class="container">

    <div class="title">
        거래 내역
    </div>

    <!-- 계좌 선택 (현재는 고정) -->
    <div class="accountArea">
        <label style="font-weight: bold; font-size: 16px; margin-right: 10px;">계좌 선택</label>

        <select id="accountDropdown" onchange="changeAccount(this)" style="padding: 8px 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 14px; font-weight: bold; color: #333;">
            <option th:each="acc : ${accountList}"
                    th:value="${acc.accountId}"
                    th:text="${#strings.substring(acc.accountNumber, 0, 3) + '-' + #strings.substring(acc.accountNumber, 3, 6) + '-' + #strings.substring(acc.accountNumber, 6, 11)}"
                    th:selected="${acc.accountId == currentAccountId}">
                123-456-78910
            </option>
        </select>
    </div>

    <!-- 테이블 -->
    <div class="tableArea">

        <table>

            <tr>
                <th>날짜</th>
                <th>유형</th>
                <th>금액</th>
                <th>위험도</th>
            </tr>

            <!-- DB 데이터 반복 -->
            <tr th:each="history : ${historyList}">

                <td th:text="${#temporals.format(history.tradeDate, 'MM/dd')}"></td>

                <td th:text="${history.tradeType}"></td>

                <td th:text="${#numbers.formatInteger(history.amount, 3, 'COMMA') + '원'}">500,000원</td>

                <td th:classappend="${history.fail} ? 'danger' : 'safe'"
                    th:text="${history.fail} ? '위험' : '정상'">
                </td>

            </tr>

        </table>

    </div>

    <div class="buttonArea">

        <a href="/home" class="confirmBtn">
            확인
        </a>

    </div>

</div>

<script>
    function changeAccount(selectElement) {
        const selectedId = selectElement.value;
        if (selectedId) {
            location.href = "/history?accountId=" + selectedId;
        }
    }
</script>

</body>
</html>
