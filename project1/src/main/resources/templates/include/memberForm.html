<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>

<div th:fragment="content">

    <div style="width:350px; margin:80px auto; text-align:center;">

        <h2>Cloud Bank 회원가입</h2>

        <form th:action="@{/signup}" method="post">

            <input type="text"
                   name="username"
                   placeholder="이름"
                   style="width:100%; height:40px; margin-bottom:15px;">

            <input type="text"
                   name="userid"
                   placeholder="ID"
                   style="width:100%; height:40px; margin-bottom:15px;">

            <input type="password"
                   name="password"
                   placeholder="PW"
                   style="width:100%; height:40px; margin-bottom:15px;">

            <input type="date"
                   name="birth"
                   style="width:100%; height:40px; margin-bottom:20px;">

            <button type="submit"
                    style="width:100%; height:45px;">
                회원가입
            </button>

        </form>

        <br>

        <a th:href="@{/login}">
            로그인으로 돌아가기
        </a>

    </div>

</div>

</body>
</html>
