<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>

<div th:fragment="content">

    <div style="width:350px; margin:80px auto; text-align:center;">

        <h2>Cloud Bank 회원가입</h2>

        <form th:action="@{/signup}" th:object="${userDto}" method="post">

            <input type="text"
                   th:field="*{name}"
                   placeholder="이름"
                   style="width:100%; height:40px; margin-bottom:5px;">
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red; text-align:left; font-size:12px; margin-bottom:10px;"></p>

            <input type="text"
                   th:field="*{username}"
                   placeholder="ID"
                   style="width:100%; height:40px; margin-bottom:5px;">
            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:red; text-align:left; font-size:12px; margin-bottom:10px;"></p>

            <input type="password"
                   th:field="*{password}"
                   placeholder="PW"
                   style="width:100%; height:40px; margin-bottom:5px;">
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red; text-align:left; font-size:12px; margin-bottom:10px;"></p>

            <input type="date"
                   th:field="*{birth}"
                   style="width:100%; height:40px; margin-bottom:5px;">
            <p th:if="${#fields.hasErrors('birth')}" th:errors="*{birth}" style="color:red; text-align:left; font-size:12px; margin-bottom:15px;"></p>

            <button type="submit" style="width:100%; height:45px;">
                회원가입
            </button>

        </form>

        <br>

        <a th:href="@{/login}">
            로그인으로 돌아가기
        </a>

    </div>

</div>

</body>
</html>
